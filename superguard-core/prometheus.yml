# SuperGuard Core - Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'superguard'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # SuperGuard API metrics
  - job_name: 'superguard-api'
    static_configs:
      - targets: ['superguard-api:8000']
    metrics_path: '/system/metrics'
    scrape_interval: 10s

  # MediaMTX metrics
  - job_name: 'mediamtx'
    static_configs:
      - targets: ['mediamtx:9998']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Node Exporter (host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
    scrape_interval: 15s

  # PostgreSQL metrics
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres:9187']
    scrape_interval: 15s

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
    scrape_interval: 15s

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
    scrape_interval: 15s