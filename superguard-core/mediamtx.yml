# MediaMTX Configuration for SuperGuard

# Paths (streams)
paths:
  # Camera streams will be dynamically created via API
  all:
    source: publisher
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s

# General settings
api: yes
apiAddress: :9997
metrics: yes
metricsAddress: :9998
pprof: yes
pprofAddress: :9999

# Logging
logLevel: info
logFile: ""
logFormat: text

# RTSP
rtspAddress: :8554
rtspAuthMethod: none

# RTMP
rtmpAddress: :1935

# HLS
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsSegmentCount: 5
hlsSegmentDuration: 2s
hlsPartDuration: 500ms
hlsEncryption: no

# WebRTC
webrtcAddress: :8889
webrtcICEServers:
  - urls:
      - stun:stun.l.google.com:19302

# SRT
srtAddress: :9997

# Path-specific settings (can be overridden via API)
# Example for a camera stream:
# paths:
#   cam1:
#     source: rtsp://camera-ip:554/stream
#     sourceOnDemand: yes
#     sourceOnDemandStartTimeout: 10s
#     runOnInit: ""
#     runOnDemand: ""
#     runOnDemandStartTimeout: 10s
#     runOnDemandCloseAfter: 10s