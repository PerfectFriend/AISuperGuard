[project]
name = "superguard-core"
version = "2.0.0-dev"
description = "SuperGuard Alarm - Cross-platform Security Platform Core"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SuperGuard Team", email = "team@superguard.local"}
]
keywords = ["security", "surveillance", "iot", "alarm", "yolo", "onnx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.0.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "ultralytics>=8.3.0",
    "aiohttp>=3.9.0",
    "zeroconf>=0.134.0",
    "wsdiscovery>=1.0.0",
    "onvif-zeep>=0.2.12",
    "tinytuya>=1.5.0",
    "paho-mqtt>=2.0.0",
    "aiocoap>=0.4.8",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-prometheus>=1.24.0",
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",
    "watchdog>=4.0.0",
    "python-slugify>=8.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.13.0",
    "httpx>=0.27.0",
    "testcontainers>=4.6.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
gpu = [
    "onnxruntime-gpu>=1.18.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
superguard-core = "superguard_core.main:main"
superguard-migrate = "superguard_core.scripts.migrate:main"

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "SIM", "TCH", "ARG", "PTH", "ERA", "PL", "TRY"]
ignore = ["S101", "S106", "B008", "PTH118", "PTH120"]
per-file-ignores = {
    "tests/*": ["S101", "S106", "B011"],
    "scripts/*": ["S101", "S106"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "superguard_core.plugins.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["superguard_core"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
