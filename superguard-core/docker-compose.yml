# SuperGuard Core - Docker Configuration

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: superguard-postgres
    environment:
      POSTGRES_DB: superguard
      POSTGRES_USER: superguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superguard123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superguard -d superguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superguard-net

  # Redis for event bus and caching
  redis:
    image: redis:7-alpine
    container_name: superguard-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - superguard-net

  # SuperGuard Core API
  superguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: superguard-api
    environment:
      - SG_DATABASE_URL=postgresql+asyncpg://superguard:superguard123@postgres:5432/superguard
      - SG_REDIS_URL=redis://redis:6379/0
      - SG_STORAGE_PATH=/app/storage
      - SG_HOST=0.0.0.0
      - SG_PORT=8000
      - SG_DEBUG=false
      - SG_LOG_LEVEL=INFO
      - SG_SECRET_KEY=${SG_SECRET_KEY:-changeme}
      - SG_JWT_PUBLIC_KEY=${SG_JWT_PUBLIC_KEY}
      - SG_JWT_PRIVATE_KEY=${SG_JWT_PRIVATE_KEY}
    volumes:
      - superguard_storage:/app/storage
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - superguard-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # MediaMTX for RTSP/HLS streaming
  mediamtx:
    image: bluenviron/mediamtx:v1.10.0
    container_name: superguard-mediamtx
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
      - "1935:1935"   # RTMP
      - "9997:9997"   # SRT
      - "9998:9998"   # SRT
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - superguard-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9997/v3/paths/list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: superguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - superguard-api
      - mediamtx
    networks:
      - superguard-net

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: superguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - superguard-net

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: superguard-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - superguard-net

volumes:
  postgres_data:
  redis_data:
  superguard_storage:
  prometheus_data:
  grafana_data:

networks:
  superguard-net:
    driver: bridge